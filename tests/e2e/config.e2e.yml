---
environment: "debug"
db:
  driver: "mysql"
  connection: "crynux_relay:crynuxrelaypass@(mysql_relay:3306)/crynux_relay?parseTime=true"
  log:
    level: "info"
    output: "data/logs/db.log"
    max_file_size: 100
    max_days: 30
    max_file_num: 5
log:
  level: "debug"
  output: "data/logs/relay.log"
  max_file_size: 100
  max_days: 30
  max_file_num: 5
  features:
    node_health_enabled: true
    node_status_enabled: true
    task_assignment_enabled: true
    task_validation_group_enabled: true
http:
  host: "0.0.0.0"
  port: "8080"
  max_body_bytes: 33554432
  jwt:
    secret_key_file: "config/secrets/jwt_secret_key.txt"
    expires_in: 3600
admin:
  auth_token: ""
data_dir:
  inference_tasks: "data/inference_tasks"
  slashed_tasks: "data/slashed_tasks"
blockchains:
  crynux-on-base-sepolia:
    rps: 20
    rpc_endpoint: "https://json-rpc.base-sepolia.crynux.io"
    start_block_num: 0
    gas_limit: 4294967
    gas_price: 0
    chain_id: 188962142
    account:
      address: ""
      private_key_file: "config/secrets/blockchain_system_private_key.txt"
    contracts:
      benefit_address: "0x195FeF730936C4B68BFF9F98429037ba68e82414"
      node_staking: "0x3EB72d01bd77a36ABB867eafFD6BaECE8252Ce32"
      delegated_staking: "0xC3C9CC3ce811Bd825118f2E36524716F86923f81"
    max_retries: 3
    retry_interval: 3
    send_wait_time: 30
    receipt_wait_time: 30
    sent_transaction_count_limit: 200
    delegated_staking_slash_batch_size: 20
    delegated_staking_read_page_size: 100
    withdrawal_fee: 1
    withdrawal_min: 4
    withdrawal_fee_tiers:
      - min_amount: 0
        fee_ratio: 0
    max_withdrawals_per_day: 10
deposit_withdraw_networks: {}
task:
  stake_amount: 0
  distance_threshold: 0
  task_whitelist_enabled: false
  model_whitelist_enabled: false
  minimum_node_name_number: 1
  node_name_whitelist_enabled: false
  passive_slash_mode: true
  task_tracing_duration_days: 0
  history_retention_days: 0
  history_cleanup_batch_size: 2000
  batch_create_max_items: 100
  batch_status_max_items: 500
  batch_validate_max_items: 100
  batch_abort_max_items: 100
  result_max_uncompressed_bytes: 1073741824
  timeout_query_batch_size: 100
task_pricing:
  initial_sd_overhead_seconds: 30
  initial_seconds_per_sd_pixel_step: 0.00003814697265625
  initial_llm_constant_seconds: 30
  initial_llm_seconds_per_input_byte: 0.0001
  initial_llm_seconds_per_output_token: 0.1
  initial_llm_model_switch_seconds: 120
  initial_llm_seconds_per_image: 10
  initial_llm_seconds_per_megapixel: 5
  calibration_alpha: 0.1
  calibration_regularization: 0.000000001
  calibration_max_positive_residual_multiple: 3
  calibration_warmup_success_samples: 10
  calibration_flush_interval_seconds: 3600
  default_llm_max_new_tokens: 256
  base_vram: 8
  default_queue_timeout_seconds: 21600
  max_queue_timeout_seconds: 259200
  app_validation_timeout_seconds: 600
  result_upload_timeout_seconds: 600
  timeout_multiplier: 2
  min_execution_timeout_seconds: 60
  max_execution_timeout_seconds: 7200
  queued_task_priority_snapshot_interval_seconds: 300
task_matching:
  batch_size: 100
  tick_interval_seconds: 2
model_distribution:
  controller_interval_seconds: 60
  demand_window_seconds: 1800
  safety_factor: 2.0
  min_nodes: 1
  max_nodes: 10
  download_timeout_seconds: 1800
  required_models_by_vram: []
huggingface:
  api_base_url: "https://huggingface.co"
  timeout_seconds: 5
  cache_ttl_seconds: 300
task_schema:
  stable_diffusion_inference: "https://raw.githubusercontent.com/crynux-network/stable-diffusion-task/main/schema/image-task.json"
  gpt_inference: "https://raw.githubusercontent.com/crynux-network/gpt-task/main/schema/gpt-inference-task.json"
  stable_diffusion_finetune_lora: "https://raw.githubusercontent.com/crynux-network/stable-diffusion-task/main/schema/stable-diffusion-finetune-lora-task.json"
stats:
  init_start_time: "2026-01-01T00:00:00Z"
network_flops:
  gpu_flops_file: "config/gpu_flops.json"
withdraw:
  relay_wallet_address: ""
  min_withdrawal_amount: 5
  withdrawal_fee: 1
  withdrawal_fee_address: ""
dao:
  task_fee_share_address: ""
  task_fee_share_percent: 2
  mainnet_start_time: "2026-01-01T00:00:00Z"
  apr_start_time: "2026-07-01T00:00:00Z"
relay_account:
  deposit_address: ""
mac:
  secret_key_file: "config/secrets/mac_secret_key.txt"
metrics:
  enabled: true
  port: "9090"
  vram_tiers: [8, 16, 24, 32, 48]
  task_execution_timeout_buckets: [30, 60, 120, 180, 300, 600, 900, 1200, 1800, 3600, 7200]
staking_score:
  locked_emission_coefficient: 1.0
qos:
  score_pool_size: 50
  tracing_max_task_events: 50
  kickout_threshold: 2.0
  rejoin_qos_long_floor: 0.3
  penalty_factor: 0.3
  first_timeout_penalty_factor: 0.95
  first_timeout_health_threshold: 0.99
  success_boost: 0.15
  recovery_tau_minutes: 30
  health_exclude_enter_threshold: 0.2
  health_exclude_exit_threshold: 0.8
